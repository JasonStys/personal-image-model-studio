name: Release native CPU applications
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact validated commit or ref
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: native-release-v0.2.0
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit }}
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "$(gh run list --workflow validate.yml --commit "$sha" --limit 1 --json conclusion --jq '.[0].conclusion')" = success
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view v0.2.0 --json isDraft,targetCommitish > /tmp/pims-release.json 2>/dev/null; then
            test "$(jq -r '.isDraft' /tmp/pims-release.json)" = true
            test "$(jq -r '.targetCommitish' /tmp/pims-release.json)" = "$sha"
          else
            gh release create v0.2.0 --draft --target "$sha" --title "Personal Image Model Studio 0.2.0 — private local CPU app" --notes-file docs/releases/v0.2.0.md
          fi
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - if: runner.os != 'macOS'
        run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[cpu,desktop]"
      - run: python -m pip check
      - run: npm ci
      - run: npm run build
      - run: python scripts/build_native.py
      - if: runner.os == 'Windows'
        run: python scripts/smoke_native.py artifacts/native/PersonalImageModelStudio.exe
      - if: runner.os != 'Windows'
        run: python scripts/smoke_native.py artifacts/native/PersonalImageModelStudio
      - name: Attach verified package to draft release, not Actions storage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.2.0 artifacts/native/PersonalImageModelStudio-0.2.0-*.sha256 --clobber
          if [ "$RUNNER_OS" = Windows ]; then
            gh release upload v0.2.0 artifacts/native/PersonalImageModelStudio-0.2.0-*.zip --clobber
          else
            gh release upload v0.2.0 artifacts/native/PersonalImageModelStudio-0.2.0-*.tar.gz --clobber
          fi
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v0.2.0 --draft=false
