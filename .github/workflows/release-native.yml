# Jason Stys: QA-gated portable downloads; upload to a draft Release, not scarce Actions artifact storage.
name: Release native CPU applications
on:
  workflow_dispatch:
env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
permissions:
  contents: read
concurrency:
  group: native-release-v0.3.1
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - name: Require passed validation for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/native_release_guard.py source
      - name: Create or resume an unpublished release for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/native_release_guard.py prepare
  build:
    needs: prepare
    name: Current native app / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "3.14.10", check-latest: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: "24", package-manager-cache: false }
      - run: python -m pip install --require-hashes -r requirements-native.lock
      - run: python -m pip check
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Bound official Ubuntu mirror access on the disposable runner
        if: runner.os == 'Linux'
        timeout-minutes: 1
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$(uname -m)" = "x86_64"
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test -f /etc/apt/apt-mirrors.txt
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          grep -Eq '^URIs:[[:space:]]+mirror[+]file:/etc/apt/apt-mirrors[.]txt[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          grep -Eq '^Signed-By:[[:space:]]+/usr/share/keyrings/ubuntu-archive-keyring[.]gpg[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          # Preserve source suites, components and signature checks; avoid the stalled HTTP Azure mirror.
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          # APT reads this leaf after the runner defaults; these are acquire, not APT::Acquire, keys.
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/zzzz-portfolio-network >/dev/null
          apt_network_config="$(apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout)"
          printf '%s\n' "$apt_network_config"
          grep -Fx 'Acquire::Retries "1";' <<< "$apt_network_config"
          grep -Fx 'Acquire::http::Timeout "15";' <<< "$apt_network_config"
          grep -Fx 'Acquire::https::Timeout "15";' <<< "$apt_network_config"
      - name: Install real browser operating-system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: npx playwright install-deps chromium
      - name: Install the exact locked browser
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Build and exercise the actual extracted current native application
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run
            xvfb-run -a python -m pytest tests/test_native_owner.py tests/test_native_host.py tests/test_native_profile.py tests/test_native_identity.py tests/test_native_privacy.py tests/test_native_notices.py tests/test_runtime_terms.py -q
            xvfb-run -a python scripts/build_native.py
            xvfb-run -a python scripts/smoke_native.py release/bin/PersonalImageModelStudio
            xvfb-run -a python scripts/native_acceptance.py --built-directory release
          elif [ "$RUNNER_OS" = "Windows" ]; then
            python -m pytest tests/test_native_owner.py tests/test_native_host.py tests/test_native_profile.py tests/test_native_identity.py tests/test_native_privacy.py tests/test_native_notices.py tests/test_runtime_terms.py -q
            python scripts/build_native.py
            python scripts/smoke_native.py release/bin/PersonalImageModelStudio.exe
            python scripts/native_acceptance.py --built-directory release
          else
            python -m pytest tests/test_native_owner.py tests/test_native_host.py tests/test_native_profile.py tests/test_native_identity.py tests/test_native_privacy.py tests/test_native_notices.py tests/test_runtime_terms.py -q
            python scripts/build_native.py
            python scripts/smoke_native.py release/bin/PersonalImageModelStudio
            python scripts/native_acceptance.py --built-directory release
          fi
      - name: Upload only the accepted immutable portable archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/native_release_guard.py upload
  verify-draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # GitHub requires push access to see unpublished drafts; this job only reads.
      contents: write
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "3.12" }
      - name: Verify complete draft; publication follows independent downloaded-app review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/native_release_guard.py verify
