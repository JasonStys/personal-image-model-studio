# Validate source, real ML behavior, browser portability, dependency safety and native packaging.
name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 15 * * 1'
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check studio scripts tests
      - run: python -m ruff format --check studio scripts tests
      - run: python -m pytest tests/test_core.py tests/test_deviantart.py tests/test_jobs.py --cov=studio --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/contracts.xml
      - run: python -m pip check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: contracts-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/*.xml
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
      - run: npm run build
      - run: npx prettier --check web tests/*.ts playwright.config.ts index.html tsconfig.json package.json
      - run: node scripts/code_index.mjs --check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm audit --audit-level=low
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-reports
          path: |
            artifacts/*.json
            artifacts/ui-*.png
            test-results/
  machine-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,ml]" pip-audit==2.10.1
      - run: python -m pip check
      - run: python -m pytest tests/test_ml.py --junitxml=artifacts/ml.xml
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          RUN_ML_BROWSER: '1'
      - run: python -m pip_audit --format json --output artifacts/dependency-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: real-ml-reports
          path: |
            artifacts/*.xml
            artifacts/*.json
            artifacts/ui-*.png
            test-results/
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: python -m pip install -e ".[desktop]"
      - run: npm ci
      - run: npm run build
      - run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-portable-shell-unsigned
          path: artifacts/desktop/PersonalImageModelStudio/
          retention-days: 14
